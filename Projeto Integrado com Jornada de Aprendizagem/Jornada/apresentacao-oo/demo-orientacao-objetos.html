<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastAriam - Orientacao a Objetos</title>
    <style>
      :root {
        --brand: #1f4f8f;
        --hazard: #d7282f;
        --ink: #0a0a0a;
        --paper: #f4f5f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 20% 0%, rgb(31 79 143 / 0.14), transparent 26rem),
          linear-gradient(180deg, #ffffff, var(--paper));
        color: var(--ink);
        font-family: Inter, Arial, sans-serif;
      }

      main {
        width: min(1100px, calc(100% - 32px));
        margin: 0 auto;
        padding: 36px 0;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 22px;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 4vw, 52px);
        letter-spacing: -0.04em;
      }

      .tag {
        color: var(--hazard);
        font-family: "Courier New", monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }

      .card {
        border: 1px solid rgb(228 228 231);
        border-radius: 8px;
        background: rgb(255 255 255 / 0.86);
        box-shadow: 0 18px 42px -34px rgb(15 23 42 / 0.7);
        padding: 18px;
      }

      .wide {
        grid-column: span 2;
      }

      .dark {
        background: #08111f;
        border-color: #1b2a41;
        color: white;
      }

      .label {
        color: #71717a;
        font-family: "Courier New", monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .dark .label {
        color: rgb(255 255 255 / 0.48);
      }

      .value {
        margin-top: 8px;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      pre {
        margin: 12px 0 0;
        overflow: auto;
        border-radius: 6px;
        background: #0a0a0a;
        color: #d4d4d8;
        padding: 14px;
        font-size: 12px;
        line-height: 1.5;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        border: 1px solid rgb(228 228 231);
        background: white;
        padding: 7px 10px;
        font-family: "Courier New", monospace;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: #16a34a;
      }

      @media (max-width: 820px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .wide {
          grid-column: span 1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="tag">FastAriam - demonstracao</p>
          <h1>Orientacao a Objetos no site logistico</h1>
        </div>
        <span class="pill"><span class="dot"></span> exemplo executavel</span>
      </header>

      <section class="grid">
        <article class="card dark">
          <div class="label">Empresa</div>
          <div class="value" id="empresa"></div>
        </article>

        <article class="card">
          <div class="label">Pedidos</div>
          <div class="value" id="pedidos"></div>
        </article>

        <article class="card">
          <div class="label">Risco da rota</div>
          <div class="value" id="risco"></div>
        </article>

        <article class="card wide">
          <div class="label">Resumo gerado por objetos</div>
          <pre id="resumo"></pre>
        </article>

        <article class="card">
          <div class="label">Polimorfismo nos arquivos</div>
          <pre id="arquivos"></pre>
        </article>
      </section>
    </main>

    <script type="module">
      import {
        ArquivoCSV,
        ArquivoPDF,
        ArquivoXLSX,
        CentralLogistica,
        Empresa,
        ImportadorArquivo,
        Pedido,
        Rota,
        UsuarioOperacional,
      } from "./dominio-logistico.js";

      const empresa = new Empresa({
        nome: "Ariam Comercio",
        cidade: "Londrina",
        estado: "PR",
        cnpj: "00.000.000/0001-00",
      });

      const operador = new UsuarioOperacional({
        nome: "Mariana Alves",
        email: "operacao@fastariam.com.br",
        setor: "Torre Nacional",
      });

      const central = new CentralLogistica({
        empresa,
        operador,
        importador: new ImportadorArquivo(),
      });

      const pedido = new Pedido({
        numero: "PED-1284",
        cliente: "Mercado Norte",
        origem: "Londrina/PR",
        destino: "Salvador/BA",
        pesoKg: 840,
      });

      const rota = new Rota({
        codigo: "LDB-SSA",
        origem: "Londrina/PR",
        destino: "Salvador/BA",
        distanciaKm: 2120,
        prazoHoras: 38,
      });

      central.registrarPedido(pedido);
      const despacho = central.despacharPedido("PED-1284", rota);

      const arquivos = central.importador.validarArquivos([
        new ArquivoPDF({ nome: "pedidos-maio.pdf", tamanhoMb: 12, linhas: 0 }),
        new ArquivoXLSX({ nome: "tabela-fretes.xlsx", tamanhoMb: 4, linhas: 1200 }),
        new ArquivoCSV({ nome: "clientes-novos.csv", tamanhoMb: 1, linhas: 78 }),
      ]);

      document.querySelector("#empresa").textContent = empresa.localizacao;
      document.querySelector("#pedidos").textContent = central.gerarResumo().totalPedidos;
      document.querySelector("#risco").textContent = despacho.risco;
      document.querySelector("#resumo").textContent = JSON.stringify(
        {
          resumo: central.gerarResumo(),
          despacho: {
            rota: despacho.rota.codigo,
            frete: `R$ ${despacho.frete}`,
            risco: despacho.risco,
          },
        },
        null,
        2
      );
      document.querySelector("#arquivos").textContent = JSON.stringify(arquivos, null, 2);
    </script>
  </body>
</html>
