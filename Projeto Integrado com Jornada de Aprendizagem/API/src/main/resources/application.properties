# Porta em que a API vai rodar
server.port=8080

# Configurações do banco H2 (banco em memória, não precisa instalar nada)
spring.datasource.url=jdbc:h2:mem:authdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Permite acessar o painel visual do banco H2 no navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cria as tabelas automaticamente com base nas entidades Java
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
